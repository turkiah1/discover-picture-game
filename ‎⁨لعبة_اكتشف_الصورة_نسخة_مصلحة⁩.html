<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>اكتشف الصورة</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f5f3ff;font-family:Arial,Tahoma,sans-serif;color:#252238}
main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 28px rgba(40,30,90,.10)}
h1{text-align:center;color:#604fd0;margin:8px 0}.hint{text-align:center;color:#777}.box{background:#faf9ff;border:1px solid #e3defe;border-radius:16px;padding:14px;margin:12px 0}
label{font-weight:bold;display:block;margin:8px 0 5px}input,select{width:100%;padding:12px;border:1px solid #d8d4e8;border-radius:11px;font-size:16px;background:white;color:#252238}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:13px;padding:13px 18px;font-size:17px;font-weight:bold;cursor:pointer;background:#604fd0;color:white;min-height:48px}.muted{background:#eeeaff;color:#604fd0}.danger{background:#fff0f0;color:#b52e39}
.center{text-align:center;margin-top:16px}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.error{display:none;background:#fff0f0;color:#a92c38;border:1px solid #f0b8bd;padding:11px;border-radius:10px;margin:12px 0;font-weight:bold}
#game{display:none}.gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.puzzle{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:18px;background:#ddd}.puzzle img{width:100%;height:100%;object-fit:cover}
.cover{position:absolute;width:50%;height:50%;background:#604fd0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold;transition:opacity .4s,transform .4s}.c1{right:0;top:0}.c2{left:0;top:0}.c3{right:0;bottom:0}.c4{left:0;bottom:0}.open{opacity:0;transform:scale(.65);pointer-events:none}
.answer{display:block;width:100%;text-align:right;margin:9px 0;padding:13px;border:2px solid #e2def5;background:#fff;border-radius:12px;font-size:17px}.good{background:#e9f8f0;border-color:#189760}.bad{background:#fff0f0;border-color:#d54a55}.status{min-height:34px;font-weight:bold;margin-top:10px}.score{font-weight:bold;background:#fff6d9;padding:9px 13px;border-radius:20px;display:inline-block}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:14px}.finish{text-align:center;font-size:23px;color:#168b59;font-weight:bold}.saved{text-align:center;color:#168b59;font-size:14px;margin-top:8px}
@media(max-width:720px){.gamegrid,.opts{grid-template-columns:1fr}.card{padding:12px}.cover{font-size:34px}}
</style>
</head>

var DEFAULT_IMAGE=document.getElementById("defaultImage").src;
var defaults=[
 {q:"تعريف الإقامة؟",op:["الإعلام بالقيام للصلاة","انتهت الصلاة","تبقى ساعة على الصلاة","الاستعداد للصلاة"],correct:0},
 {q:"عدد جمل الإقامة؟",op:["٥","١١","٤","٨"],correct:1},
 {q:"الجملة التي تتكرر في الإقامة دون الأذان؟",op:["قد قامت الصلاة","الصلاة خير من النوم","حي على الصلاة","حي على الفلاح"],correct:0},
 {q:"الصلاة التي لها إقامة من بين الصلوات التالية:",op:["الاستسقاء","الكسوف","الخسوف","الفجر"],correct:3}
];
var letters=["أ","ب","ج","د"], box=document.getElementById("questions");
for(var i=1;i<=4;i++){
 var d=document.createElement("div");d.className="box";
 d.innerHTML='<label>السؤال '+i+'</label><input id="q'+i+'" type="text">'+
 '<div class="opts">'+
 '<div><label>أ</label><input id="q'+i+'a" type="text"></div>'+
 '<div><label>ب</label><input id="q'+i+'b" type="text"></div>'+
 '<div><label>ج</label><input id="q'+i+'c" type="text"></div>'+
 '<div><label>د</label><input id="q'+i+'d" type="text"></div></div>'+
 '<label>الإجابة الصحيحة</label><select id="q'+i+'correct"><option value="0">أ</option><option value="1">ب</option><option value="2">ج</option><option value="3">د</option></select>';
 box.appendChild(d);
}
function loadDefaults(){
 document.getElementById("photoName").value="آداب المشي إلى الصلاة";
 defaults.forEach(function(x,idx){
  var n=idx+1;document.getElementById("q"+n).value=x.q;
  ["a","b","c","d"].forEach(function(k,j){document.getElementById("q"+n+k).value=x.op[j];});
  document.getElementById("q"+n+"correct").value=String(x.correct);
 });
}
loadDefaults();

var data=[],index=0,points=0,soundOn=true,currentImage=DEFAULT_IMAGE;
function err(t){var e=document.getElementById("error");e.textContent=t;e.style.display="block";e.scrollIntoView({behavior:"smooth",block:"center"});}
function clearErr(){document.getElementById("error").style.display="none";}
function beep(ok){if(!soundOn)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var c=new AC(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?720:220;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12);}catch(e){}}
function collectAndStart(){
 clearErr();data=[];
 var title=document.getElementById("photoName").value.trim();
 if(!title){err("اكتبي اسم الدرس أو الصورة.");return;}
 for(var n=1;n<=4;n++){
  var q=document.getElementById("q"+n).value.trim(),op=[];
  for(var k=0;k<4;k++)op.push(document.getElementById("q"+n+["a","b","c","d"][k]).value.trim());
  if(!q||op.some(function(v){return !v;})){err("أكملي السؤال رقم "+n+" وجميع خياراته.");return;}
  data.push({q:q,op:op,correct:Number(document.getElementById("q"+n+"correct").value)});
 }
 var file=document.getElementById("photo").files[0];
 if(file){
  var r=new FileReader();
  r.onload=function(e){currentImage=e.target.result;begin(title);};
  r.onerror=function(){err("تعذر قراءة الصورة. جربي JPG أو PNG.");};
  r.readAsDataURL(file);
 }else begin(title);
}
function begin(title){
 document.getElementById("picture").src=currentImage;
 document.getElementById("gameTitle").textContent="🧩 "+title;
 index=0;points=0;
 document.querySelectorAll(".cover").forEach(function(x){x.classList.remove("open");});
 document.getElementById("score").textContent="⭐ النقاط: 0";
 document.getElementById("setup").style.display="none";document.getElementById("game").style.display="block";
 render();window.scrollTo(0,0);
}
function render(){
 document.getElementById("finish").innerHTML="";
 document.getElementById("status").textContent="";
 document.getElementById("qno").textContent="السؤال "+(index+1)+" من 4";
 document.getElementById("qtext").textContent=data[index].q;
 var a=document.getElementById("answers");a.innerHTML="";
 data[index].op.forEach(function(txt,j){
  var b=document.createElement("button");b.type="button";b.className="answer";b.textContent=letters[j]+") "+txt;
  b.addEventListener("click",function(){check(j,b);});a.appendChild(b);
 });
}
function check(choice,button){
 if(choice===data[index].correct){
  button.classList.add("good");beep(true);points+=10;
  document.getElementById("score").textContent="⭐ النقاط: "+points;
  document.getElementById("status").textContent="✅ إجابة صحيحة! +10 نقاط";
  document.querySelectorAll(".cover")[index].classList.add("open");
  document.querySelectorAll(".answer").forEach(function(x){x.disabled=true;});
  setTimeout(function(){index++;if(index<4)render();else complete();},500);
 }else{
  button.classList.add("bad");beep(false);document.getElementById("status").textContent="❌ حاولي مرة أخرى";
  setTimeout(function(){button.classList.remove("bad");},450);
 }
}
function complete(){
 document.querySelectorAll(".cover").forEach(function(x){x.classList.add("open");});
 document.getElementById("qno").textContent="";document.getElementById("qtext").textContent="";
 document.getElementById("answers").innerHTML="";document.getElementById("status").textContent="";
 document.getElementById("finish").innerHTML='<div class="finish">🎉 أحسنت! اكتشفت الصورة كاملة<br><br>🏆 مجموع النقاط: '+points+'</div>';
}
document.getElementById("startBtn").addEventListener("click",collectAndStart);
document.getElementById("soundBtn").addEventListener("click",function(){soundOn=!soundOn;this.textContent=soundOn?"🔊 الصوت":"🔇 مكتوم";});
document.getElementById("newBtn").addEventListener("click",function(){document.getElementById("game").style.display="none";document.getElementById("setup").style.display="block";window.scrollTo(0,0);});
document.getElementById("resetBtn").addEventListener("click",function(){loadDefaults();document.getElementById("photo").value="";currentImage=DEFAULT_IMAGE;clearErr();window.scrollTo(0,0);});
})();
</script></body></html>
